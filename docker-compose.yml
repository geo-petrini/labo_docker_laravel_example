services:
  app:
    build: .
    container_name: laravel-postgres-app
    ports:
      - "8020:80"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: segreta
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: laravel-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: segreta
      POSTGRES_DB: laravel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: